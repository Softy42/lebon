name: Publier sur IONOS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Verifier les changements, publier, ou restaurer la version precedente"
        required: true
        type: choice
        default: verifier
        options:
          - verifier
          - publier
          - restaurer

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  publication:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recuperer les fichiers et les videos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Tester la publication et la restauration sans reseau
        run: python3 .github/scripts/test_deploy_ionos.py

      - name: Installer le client SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-paramiko

      - name: Verifier ou publier sur IONOS
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DEPLOY_ACTION: ${{ inputs.action }}
        run: /usr/bin/python3 .github/scripts/deploy_ionos.py
